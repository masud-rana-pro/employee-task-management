# ---------------------------------------------------------------
# Application configuration.
# Every secret / environment-specific value comes from an
# environment variable (see README "Environment variables").
# ---------------------------------------------------------------
spring.application.name=task-management-api
# Render / Railway inject PORT. Falls back to 8080 locally.
server.port=${PORT:8080}

# ---- Database (MySQL 8) ----
# DB_URL example (local):  jdbc:mysql://localhost:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# DB_URL example (cloud):  jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Small pool: free cloud MySQL plans allow very few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# ---- JPA / Hibernate ----
# The schema is owned by schema.sql, so Hibernate must never touch it.
spring.jpa.hibernate.ddl-auto=none
# Keep DB access inside the service layer (no lazy loading in controllers/JSON).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---- JWT ----
# JWT_SECRET must be at least 32 characters (256 bit). The app refuses to start otherwise.
app.jwt.secret=${JWT_SECRET:}
# Token lifetime, default 1 hour.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- CORS ----
# Comma separated list of allowed browser origins (Angular app URL).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---- Errors / JSON ----
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=non_null
