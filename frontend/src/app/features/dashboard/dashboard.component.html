<h1 class="page-title mb-1">Dashboard</h1>
<p class="text-muted mb-4">Welcome back, {{ auth.userName }}.</p>

<div *ngIf="loading" class="text-center py-5"><div class="spinner-border"></div></div>

<ng-container *ngIf="stats">
  <div class="row g-3 mb-4">
    <div class="col-12 col-sm-6 col-lg-3" *ngFor="let card of cards">
      <div class="card stat-card" [ngClass]="'stat-' + card.color">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="text-muted small">{{ card.label }}</div>
            <div class="stat-value">{{ card.value }}</div>
          </div>
          <i class="bi stat-icon" [ngClass]="card.icon"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h2 class="h6 mb-3">
        <ng-container *ngIf="stats.role === 'ADMIN'">All tasks by status</ng-container>
        <ng-container *ngIf="stats.role === 'MANAGER'">Tasks I assigned, by status</ng-container>
        <ng-container *ngIf="stats.role === 'EMPLOYEE'">My tasks by status</ng-container>
        <span class="text-muted fw-normal">({{ stats.totalTasks ?? 0 }} total)</span>
      </h2>
      <div *ngFor="let s of statuses" class="mb-3">
        <div class="d-flex justify-content-between small mb-1">
          <span>{{ s.replace('_', ' ') }}</span><span>{{ count(s) }} ({{ percent(s) }}%)</span>
        </div>
        <div class="progress" style="height: 10px">
          <div class="progress-bar" [ngClass]="barClass(s)" [style.width.%]="percent(s)"></div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
