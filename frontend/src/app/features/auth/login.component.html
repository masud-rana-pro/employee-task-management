<div class="login-wrapper">
  <div class="card login-card">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1"><i class="bi bi-kanban me-2"></i>TaskManager</h1>
      <p class="text-center text-muted mb-4">Sign in to continue</p>

      <div *ngIf="sessionExpired" class="alert alert-warning py-2">Your session has expired. Please log in again.</div>
      <div *ngIf="errorMessage" class="alert alert-danger py-2" role="alert">{{ errorMessage }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username"
                 [class.is-invalid]="invalid('email')" />
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" formControlName="password"
                 autocomplete="current-password"
                 [class.is-invalid]="invalid('password')" />
          <div class="invalid-feedback">Password is required.</div>
        </div>
        <button type="submit" class="btn btn-dark w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>Login
        </button>
      </form>
    </div>
  </div>
</div>
