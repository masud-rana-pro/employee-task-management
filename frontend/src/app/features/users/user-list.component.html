<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="page-title mb-0">Users</h1>
  <button type="button" class="btn btn-dark" (click)="openForm()"><i class="bi bi-plus-lg me-1"></i>Add user</button>
</div>

<div class="card table-card">
  <div class="card-body border-bottom">
    <div class="input-group" style="max-width: 360px">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input type="search" class="form-control" placeholder="Search by name or email"
             [ngModel]="search" (ngModelChange)="onSearch($event)" />
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Manager</th><th class="text-end">Actions</th></tr>
      </thead>
      <tbody>
        <tr *ngIf="loading"><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></td></tr>
        <tr *ngIf="!loading && users.length === 0"><td colspan="5" class="text-center text-muted py-4">No users found.</td></tr>
        <tr *ngFor="let u of users">
          <td>{{ u.fullName }}</td>
          <td>{{ u.email }}</td>
          <td><span class="badge" [ngClass]="roleClass(u.role)">{{ u.role }}</span></td>
          <td>{{ u.managerName || '-' }}</td>
          <td class="text-end text-nowrap">
            <button type="button" class="btn btn-sm btn-outline-secondary me-1" (click)="openForm(u)" title="Edit">
              <i class="bi bi-pencil"></i>
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(u)" title="Delete">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card-body d-flex justify-content-between align-items-center" *ngIf="total > 0">
    <span class="text-muted small">{{ total }} user(s)</span>
    <ngb-pagination [collectionSize]="total" [(page)]="page" [pageSize]="pageSize" [maxSize]="5"
                    [boundaryLinks]="true" size="sm" class="mb-0" (pageChange)="load()"></ngb-pagination>
  </div>
</div>
