<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="page-title mb-0">My tasks</h1>
  <select class="form-select w-auto" [(ngModel)]="statusFilter" (ngModelChange)="filterChanged()" aria-label="Status">
    <option value="">All statuses</option>
    <option *ngFor="let s of statuses" [value]="s">{{ s.replace('_', ' ') }}</option>
  </select>
</div>

<div class="card table-card">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
        <tr><th>Title</th><th>Assigned by</th><th>Priority</th><th>Status</th><th>Deadline</th><th class="text-end">Action</th></tr>
      </thead>
      <tbody>
        <tr *ngIf="loading"><td colspan="6" class="text-center py-4"><div class="spinner-border spinner-border-sm"></div></td></tr>
        <tr *ngIf="!loading && tasks.length === 0"><td colspan="6" class="text-center text-muted py-4">No tasks assigned to you.</td></tr>
        <tr *ngFor="let t of tasks">
          <td>
            <div class="fw-semibold">{{ t.title }}</div>
            <div class="small text-muted text-truncate-cell" *ngIf="t.description">{{ t.description }}</div>
          </td>
          <td>{{ t.assignedByName }}</td>
          <td><app-priority-badge [priority]="t.priority"></app-priority-badge></td>
          <td><app-status-badge [status]="t.status"></app-status-badge></td>
          <td [class.overdue]="isOverdue(t)">{{ t.deadline ? (t.deadline | date: 'dd MMM yyyy') : '-' }}</td>
          <td class="text-end">
            <button *ngIf="nextStatus(t)" type="button" class="btn btn-sm btn-dark" [disabled]="updatingId === t.id"
                    (click)="advance(t)">
              <span *ngIf="updatingId === t.id" class="spinner-border spinner-border-sm me-1"></span>{{ buttonLabel(t) }}
            </button>
            <span *ngIf="!nextStatus(t)" class="text-success small"><i class="bi bi-check2-circle"></i> Completed</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="card-body d-flex justify-content-between align-items-center" *ngIf="total > 0">
    <span class="text-muted small">{{ total }} task(s)</span>
    <ngb-pagination [collectionSize]="total" [(page)]="page" [pageSize]="pageSize" [maxSize]="5"
                    [boundaryLinks]="true" size="sm" class="mb-0" (pageChange)="load()"></ngb-pagination>
  </div>
</div>
