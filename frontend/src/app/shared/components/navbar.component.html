<nav *ngIf="session$ | async as session" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/dashboard">
      <i class="bi bi-kanban me-2"></i>TaskManager
    </a>

    <button class="navbar-toggler" type="button" aria-label="Toggle navigation" (click)="collapsed = !collapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse" [ngbCollapse]="collapsed">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" *ngFor="let link of linksFor(session.role)">
          <a class="nav-link"
             [routerLink]="link.path"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: !!link.exact }"
             (click)="collapsed = true">
            <i class="bi {{ link.icon }} me-1"></i>{{ link.label }}
          </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <span class="text-light small">
          <i class="bi bi-person-circle me-1"></i>{{ session.name }}
          <span class="badge text-bg-secondary ms-1">{{ session.role }}</span>
        </span>
        <button type="button" class="btn btn-outline-light btn-sm" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </div>
</nav>
