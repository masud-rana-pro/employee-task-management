<ng-container *ngIf="session$ | async as session">
  <!-- Small screens: a slim top bar with a menu button -->
  <header class="mobile-bar d-lg-none">
    <button type="button" class="btn btn-link text-white p-0 me-3" aria-label="Open menu" (click)="collapsed = !collapsed">
      <i class="bi bi-list fs-2"></i>
    </button>
    <span class="fw-semibold text-white"><i class="bi bi-kanban me-2"></i>TaskManager</span>
  </header>
  <div class="sidebar-backdrop d-lg-none" *ngIf="!collapsed" (click)="collapsed = true"></div>

  <!-- Sidebar: always visible on large screens, slides in on small screens -->
  <aside class="sidebar" [class.open]="!collapsed">
    <a class="sidebar-brand" routerLink="/dashboard" (click)="collapsed = true">
      <i class="bi bi-kanban me-2"></i>TaskManager
    </a>

    <nav class="sidebar-nav">
      <a *ngFor="let link of links$ | async; trackBy: trackByPath"
         class="sidebar-link"
         [routerLink]="link.path"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: !!link.exact }"
         (click)="collapsed = true">
        <i class="bi {{ link.icon }}"></i><span>{{ link.label }}</span>
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-person-circle fs-3"></i>
        <div class="lh-sm overflow-hidden">
          <div class="fw-semibold text-truncate">{{ session.name }}</div>
          <span class="badge text-bg-secondary mt-1">{{ session.role }}</span>
        </div>
      </div>
      <button type="button" class="btn btn-outline-light btn-sm w-100" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>Logout
      </button>
    </div>
  </aside>
</ng-container>
