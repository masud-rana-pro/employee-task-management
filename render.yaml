# Render Blueprint (optional). You can also create the service by hand in the dashboard - see DEPLOYMENT.md.
services:
  - type: web
    name: task-management-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false          # you type it in the dashboard (contains the DB host)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your Netlify URL, e.g. https://my-app.netlify.app
      - key: JWT_SECRET
        generateValue: true  # Render creates a long random value
